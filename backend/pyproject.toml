[project]
name = "gridbricks-backend"
version = "0.1.0"
description = "Day-ahead wind forecast decision-support API (Elexon BMRS FUELHH + WINDFOR)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Query()/Depends() defaults in signatures are idiomatic.
"app/main.py" = ["B008"]
# Ingest script is owned elsewhere; keep its stdlib `timezone.utc` spelling.
"scripts/ingest.py" = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# Third-party deprecation noise from starlette.testclient (pinned versions), not our code.
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
